<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">GenLikeScientificSVG 工作流程</title>
  <desc id="desc">以双重参考将论文配图需求转为可编辑 SVG 结构合同与最终光栅科研图的流程。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#52718B"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#17324A" flood-opacity="0.12"/></filter>
    <style>
      .title{font:700 45px "Hiragino Sans GB","Heiti SC","Arial Unicode MS",sans-serif;fill:#17324A}.subtitle{font:400 21px "Hiragino Sans GB","Heiti SC","Arial Unicode MS",sans-serif;fill:#52718B}.card-title{font:700 24px "Hiragino Sans GB","Heiti SC","Arial Unicode MS",sans-serif;fill:#17324A}.body{font:400 18px "Hiragino Sans GB","Heiti SC","Arial Unicode MS",sans-serif;fill:#3C5870}.small{font:600 16px "Hiragino Sans GB","Heiti SC","Arial Unicode MS",sans-serif;fill:#52718B}.label{font:700 18px "Hiragino Sans GB","Heiti SC","Arial Unicode MS",sans-serif;fill:#fff}.step{font:700 17px "Hiragino Sans GB","Heiti SC","Arial Unicode MS",sans-serif;fill:#2F7FC1}
    </style>
  </defs>
  <rect width="1600" height="1040" fill="#F7FAFC"/><rect x="54" y="48" width="1492" height="944" rx="34" fill="#fff" filter="url(#shadow)"/>
  <text x="110" y="132" class="title">GenLikeScientificSVG</text><text x="110" y="171" class="subtitle">双重参考 → 科学拓扑与配色规划 → 可编辑 SVG 结构合同 → 最终光栅科研图</text>
  <rect x="112" y="234" width="260" height="138" rx="20" fill="#E7EFFA" stroke="#2F7FC1" stroke-width="2"/><text x="142" y="280" class="card-title">配图需求</text><text x="142" y="313" class="body">想法 · 方法 · 结果</text><text x="142" y="341" class="body">论文片段 · 草图</text><rect x="126" y="207" width="96" height="34" rx="17" fill="#2F7FC1"/><text x="148" y="230" class="label">输入</text>
  <line x1="372" y1="302" x2="458" y2="302" stroke="#52718B" stroke-width="4" marker-end="url(#arrow)"/><text x="396" y="278" class="step">并行</text>
  <rect x="468" y="222" width="306" height="172" rx="20" fill="#F4FAFC" stroke="#78BECB" stroke-width="2"/><rect x="492" y="242" width="76" height="30" rx="15" fill="#78BECB"/><text x="510" y="263" class="label">网页</text><text x="492" y="308" class="card-title">领域高审美参考</text><text x="492" y="340" class="body">筛选 3–4+ 张论文 HTML / SVG 图</text><text x="492" y="368" class="body">提取惯例与创新点证据</text>
  <rect x="468" y="432" width="306" height="172" rx="20" fill="#F5F4FB" stroke="#8C8CD4" stroke-width="2"/><rect x="492" y="452" width="68" height="30" rx="15" fill="#8C8CD4"/><text x="505" y="473" class="label">RAG</text><text x="492" y="518" class="card-title">FigureBench 结构 RAG</text><text x="492" y="550" class="body">语义 + 拓扑 + 布局</text><text x="492" y="578" class="body">抽象几何语法，不检索像素</text>
  <rect x="468" y="642" width="306" height="122" rx="20" fill="#FFF7F5" stroke="#EF7A6D" stroke-width="2"/><rect x="492" y="662" width="106" height="30" rx="15" fill="#EF7A6D"/><text x="506" y="683" class="label">可选</text><text x="492" y="728" class="card-title">用户审美约束</text><text x="492" y="754" class="body">风格意图 + 用户参考图</text>
  <line x1="774" y1="308" x2="862" y2="408" stroke="#52718B" stroke-width="4" marker-end="url(#arrow)"/><line x1="774" y1="518" x2="862" y2="490" stroke="#52718B" stroke-width="4" marker-end="url(#arrow)"/><line x1="774" y1="700" x2="862" y2="564" stroke="#52718B" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="872" y="334" width="332" height="292" rx="26" fill="#F5FAF1" stroke="#96C37D" stroke-width="3"/><rect x="896" y="354" width="126" height="34" rx="17" fill="#96C37D"/><text x="918" y="378" class="label">一次规划</text><text x="896" y="430" class="card-title">科学拓扑规划</text><text x="896" y="464" class="body">图意图 · 科学压缩</text><text x="896" y="492" class="body">模块 · 层级 · 箭头 · 布局</text><text x="896" y="530" class="card-title">配色规划</text><text x="896" y="560" class="body">画布 · 文字线条 · 颜色角色 · 强调色</text><text x="896" y="591" class="small">不增加额外模型调用</text>
  <line x1="1204" y1="480" x2="1290" y2="480" stroke="#52718B" stroke-width="4" marker-end="url(#arrow)"/><rect x="1300" y="402" width="194" height="156" rx="20" fill="#E7EFFA" stroke="#2F7FC1" stroke-width="2"/><text x="1326" y="447" class="card-title">SVG 合同</text><text x="1326" y="480" class="body">科学拓扑</text><text x="1326" y="507" class="body">标签 · 边界</text><text x="1326" y="534" class="body">端口 · 配色</text>
  <line x1="1397" y1="558" x2="1397" y2="646" stroke="#52718B" stroke-width="4" marker-end="url(#arrow)"/><rect x="1226" y="656" width="338" height="224" rx="22" fill="#FFF9E9" stroke="#F3D266" stroke-width="2"/><rect x="1250" y="678" width="104" height="30" rx="15" fill="#F3D266"/><text x="1272" y="699" class="label">V0</text><text x="1250" y="748" class="card-title">光栅预览 → 一次检查</text><text x="1250" y="780" class="body">碰撞 · 箭头 · 层级</text><text x="1250" y="808" class="body">文字密度 · 局部几何</text><rect x="1250" y="828" width="178" height="34" rx="17" fill="#D8383A"/><text x="1271" y="851" class="label">仅一次局部修补</text>
  <line x1="1226" y1="768" x2="1138" y2="768" stroke="#52718B" stroke-width="4" marker-end="url(#arrow)"/><rect x="892" y="690" width="236" height="156" rx="22" fill="#17324A"/><text x="917" y="739" style="font:700 25px 'Hiragino Sans GB','Heiti SC','Arial Unicode MS',sans-serif;fill:#fff">最终光栅科研图</text><text x="917" y="775" style="font:400 18px 'Hiragino Sans GB','Heiti SC','Arial Unicode MS',sans-serif;fill:#D7E7F3">提升视觉质感</text><text x="917" y="804" style="font:400 18px 'Hiragino Sans GB','Heiti SC','Arial Unicode MS',sans-serif;fill:#D7E7F3">保持 SVG 科学拓扑</text>
  <text x="110" y="934" class="small">图像模型负责最终渲染；Skill 提供科学结构、绘图语法、配色角色与受控验证。</text>
</svg>
