<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">GenLikeScientificSVG workflow</title>
  <desc id="desc">A dual-reference workflow that turns a paper figure brief into an editable SVG contract and a final raster figure.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#52718B"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#17324A" flood-opacity="0.12"/></filter>
    <style>
      .title{font:700 45px Arial,Helvetica,sans-serif;fill:#17324A}.subtitle{font:400 21px Arial,Helvetica,sans-serif;fill:#52718B}.card-title{font:700 24px Arial,Helvetica,sans-serif;fill:#17324A}.body{font:400 18px Arial,Helvetica,sans-serif;fill:#3C5870}.small{font:600 16px Arial,Helvetica,sans-serif;fill:#52718B}.label{font:700 18px Arial,Helvetica,sans-serif;fill:#fff}.step{font:700 17px Arial,Helvetica,sans-serif;fill:#2F7FC1}
    </style>
  </defs>
  <rect width="1600" height="1040" fill="#F7FAFC"/>
  <rect x="54" y="48" width="1492" height="944" rx="34" fill="#fff" filter="url(#shadow)"/>
  <text x="110" y="132" class="title">GenLikeScientificSVG</text>
  <text x="110" y="171" class="subtitle">Dual references → scientific topology + color planning → editable SVG contract → final raster figure</text>

  <rect x="112" y="234" width="260" height="138" rx="20" fill="#E7EFFA" stroke="#2F7FC1" stroke-width="2"/>
  <text x="142" y="280" class="card-title">Figure Brief</text><text x="142" y="313" class="body">idea · method · result</text><text x="142" y="341" class="body">paper excerpt · sketch</text>
  <rect x="126" y="207" width="96" height="34" rx="17" fill="#2F7FC1"/><text x="148" y="230" class="label">INPUT</text>

  <line x1="372" y1="302" x2="458" y2="302" stroke="#52718B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="396" y="278" class="step">parallel</text>

  <rect x="468" y="222" width="306" height="172" rx="20" fill="#F4FAFC" stroke="#78BECB" stroke-width="2"/>
  <rect x="492" y="242" width="62" height="30" rx="15" fill="#78BECB"/><text x="507" y="263" class="label">WEB</text>
  <text x="492" y="308" style="font:700 22px Arial,Helvetica,sans-serif;fill:#17324A">Aesthetic domain references</text><text x="492" y="340" class="body">screen 3–4+ paper HTML / SVG figures</text><text x="492" y="368" class="body">extract conventions + novelty evidence</text>

  <rect x="468" y="432" width="306" height="172" rx="20" fill="#F5F4FB" stroke="#8C8CD4" stroke-width="2"/>
  <rect x="492" y="452" width="68" height="30" rx="15" fill="#8C8CD4"/><text x="505" y="473" class="label">RAG</text>
  <text x="492" y="518" style="font:700 22px Arial,Helvetica,sans-serif;fill:#17324A">FigureBench structure RAG</text><text x="492" y="550" class="body">semantic + topology + layout</text><text x="492" y="578" class="body">abstract geometry grammar, not pixels</text>

  <rect x="468" y="642" width="306" height="122" rx="20" fill="#FFF7F5" stroke="#EF7A6D" stroke-width="2"/>
  <rect x="492" y="662" width="106" height="30" rx="15" fill="#EF7A6D"/><text x="506" y="683" class="label">OPTIONAL</text>
  <text x="492" y="728" class="card-title">User aesthetic constraints</text><text x="492" y="754" class="body">style intent + supplied reference image</text>

  <line x1="774" y1="308" x2="862" y2="408" stroke="#52718B" stroke-width="4" marker-end="url(#arrow)"/><line x1="774" y1="518" x2="862" y2="490" stroke="#52718B" stroke-width="4" marker-end="url(#arrow)"/><line x1="774" y1="700" x2="862" y2="564" stroke="#52718B" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="872" y="334" width="332" height="292" rx="26" fill="#F5FAF1" stroke="#96C37D" stroke-width="3"/>
  <rect x="896" y="354" width="126" height="34" rx="17" fill="#96C37D"/><text x="918" y="378" class="label">PLAN ONCE</text>
  <text x="896" y="430" class="card-title">Scientific Topology Planning</text>
  <text x="896" y="464" class="body">Figure intent · scientific compression</text><text x="896" y="492" class="body">modules · hierarchy · arrows · layout</text><text x="896" y="530" class="card-title">Colour Planning</text><text x="896" y="560" class="body">canvas · ink · roles · novelty accent</text><text x="896" y="591" class="small">No additional model call</text>

  <line x1="1204" y1="480" x2="1290" y2="480" stroke="#52718B" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="1300" y="402" width="194" height="156" rx="20" fill="#E7EFFA" stroke="#2F7FC1" stroke-width="2"/>
  <text x="1326" y="447" class="card-title">SVG Contract</text><text x="1326" y="480" class="body">topology</text><text x="1326" y="507" class="body">labels · bounds</text><text x="1326" y="534" class="body">ports · colours</text>

  <line x1="1397" y1="558" x2="1397" y2="646" stroke="#52718B" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="1226" y="656" width="338" height="224" rx="22" fill="#FFF9E9" stroke="#F3D266" stroke-width="2"/>
  <rect x="1250" y="678" width="104" height="30" rx="15" fill="#F3D266"/><text x="1272" y="699" class="label">V0</text>
  <text x="1250" y="748" class="card-title">Raster preview → inspect once</text><text x="1250" y="780" class="body">collisions · arrows · hierarchy</text><text x="1250" y="808" class="body">text density · local geometry</text>
  <rect x="1250" y="828" width="148" height="34" rx="17" fill="#D8383A"/><text x="1273" y="851" class="label">PATCH × 1</text>

  <line x1="1226" y1="768" x2="1138" y2="768" stroke="#52718B" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="892" y="690" width="236" height="156" rx="22" fill="#17324A"/>
  <text x="917" y="739" style="font:700 25px Arial,Helvetica,sans-serif;fill:#fff">Final raster figure</text><text x="917" y="775" style="font:400 18px Arial,Helvetica,sans-serif;fill:#D7E7F3">improved visual finish</text><text x="917" y="804" style="font:400 18px Arial,Helvetica,sans-serif;fill:#D7E7F3">preserved SVG topology</text>
  <text x="110" y="934" class="small">The image model renders the final asset; the Skill supplies the scientific structure, drawing grammar, color roles, and bounded verification.</text>
</svg>
