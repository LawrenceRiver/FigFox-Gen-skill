interface:
  display_name: "GenLikeScientificSVG"
  short_description: "Generate complete labelled paper figures with image-generation models"
  default_prompt: "Use $genlike-scientific-svg to execute a scientific paper-figure image-generation task: create one complete labelled research figure from my brief, generate a first image draft, perform semantic SVG reconstruction, then use that SVG as the structural reference for a second image-generation call and lock the final PNG with the SVG text and geometry layer."
policy:
  allow_implicit_invocation: true
