interface:
  display_name: "GenLikeScientificSVG"
  short_description: "Generate complete labelled paper figures with image-generation models"
  default_prompt: "Use $genlike-scientific-svg to execute a scientific paper-figure image-generation task: create one complete labelled research figure from my brief with one direct image-generation call. Determine the field, learn conventions from 3–4 strong domain references and local FigureBench RAG, then return the first image draft as the final PNG; attempt SVG verification only when it can faithfully convert that actual PNG into editable layers."
policy:
  allow_implicit_invocation: true
